<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>입체도형 분류기</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #eef4ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    main {
      width: min(100%, 560px);
      padding: 28px;
      text-align: center;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(31, 55, 99, .14);
    }

    h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 5vw, 2.2rem); }
    .description { margin: 0 0 20px; color: #64748b; }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 22px;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled { background: #94a3b8; cursor: wait; }
    #status { min-height: 24px; color: #475569; }
    #webcam-container { display: flex; justify-content: center; margin: 20px 0; }
    canvas { width: min(320px, 100%); height: auto; border-radius: 14px; background: #0f172a; }
    #label-container { display: grid; gap: 8px; text-align: left; }
    .label { padding: 11px 13px; border-radius: 9px; background: #f1f5f9; font-variant-numeric: tabular-nums; }
    .hint { margin: 18px 0 0; font-size: .86rem; color: #64748b; }
  </style>
</head>
<body>
  <main>
    <h1>원기둥 · 원뿔 · 구 분류기</h1>
    <p class="description">카메라에 입체도형을 보여 주세요.</p>
    <button id="start-button" type="button">카메라 시작</button>
    <p id="status">시작 버튼을 누르면 모델과 카메라를 준비합니다.</p>
    <div id="webcam-container"></div>
    <div id="label-container"></div>
    <p class="hint">카메라 권한을 허용해야 하며 HTTPS 또는 localhost에서 실행해야 합니다.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.4/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.4-alpha2/dist/teachablemachine-image.min.js"></script>
  <script>
    // model.json, metadata.json, weights.bin은 이 폴더에 있어야 합니다.
    // model.json의 weightsManifest가 weights.bin을 상대 경로로 불러옵니다.
    const MODEL_URL = "./my_model/";

    let model;
    let webcam;
    let labelContainer;
    let maxPredictions;
    let running = false;

    const startButton = document.getElementById("start-button");
    const status = document.getElementById("status");

    startButton.addEventListener("click", init);

    async function init() {
      if (running) return;

      startButton.disabled = true;
      status.textContent = "모델을 불러오는 중입니다...";

      try {
        const modelURL = MODEL_URL + "model.json";
        const metadataURL = MODEL_URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        webcam = new tmImage.Webcam(320, 320, true);
        await webcam.setup();
        await webcam.play();

        document.getElementById("webcam-container").replaceChildren(webcam.canvas);

        labelContainer = document.getElementById("label-container");
        labelContainer.replaceChildren();

        for (let i = 0; i < maxPredictions; i++) {
          const label = document.createElement("div");
          label.className = "label";
          labelContainer.appendChild(label);
        }

        running = true;
        status.textContent = "도형을 카메라에 보여 주세요.";
        requestAnimationFrame(loop);
      } catch (error) {
        console.error(error);
        startButton.disabled = false;

        if (error.name === "NotAllowedError") {
          status.textContent = "카메라 권한이 거부되었습니다. 브라우저 설정에서 권한을 허용해 주세요.";
        } else if (location.protocol === "file:") {
          status.textContent = "file://로는 카메라가 제한될 수 있습니다. GitHub Pages 또는 localhost에서 실행해 주세요.";
        } else {
          status.textContent = "실행할 수 없습니다. my_model 폴더와 weights.bin 파일을 확인해 주세요.";
        }
      }
    }

    async function loop() {
      if (!running) return;
      webcam.update();
      await predict();
      requestAnimationFrame(loop);
    }

    async function predict() {
      const predictions = await model.predict(webcam.canvas);

      predictions.forEach((prediction, index) => {
        labelContainer.children[index].textContent =
          `${prediction.className}: ${(prediction.probability * 100).toFixed(1)}%`;
      });
    }
  </script>
</body>
</html>
